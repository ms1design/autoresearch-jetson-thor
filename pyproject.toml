[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm — Jetson AGX Thor fork"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.2.6,<3",
    "pandas>=2.3.0",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.9.0",
    "torch>=2.10.0"
]

[tool.uv]
[tool.uv.sources]
torch = [
    { index = "pytorch-test-cu130" },
]

[[tool.uv.index]]
name = "nvidia-sbsa-cu130"
url = "https://pypi.jetson-ai-lab.io/sbsa/cu130/+simple/"
explicit = true

[[tool.uv.index]]
name = "pytorch-test-cu130"
url = "https://download.pytorch.org/whl/test/cu130/"
explicit = true
